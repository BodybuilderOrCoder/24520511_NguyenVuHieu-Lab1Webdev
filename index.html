<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Web Application</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <a href="#main">Skip to Content</a>

    <header>
        <h1>My Web Application</h1>

        <button type="button" id="theme-toggle" aria-pressed="false">
            Toggle Dark Mode
        </button>

        <nav aria-label="Main Navigation">
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#projects">Projects</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

<main id="main">
    <div class="section-grid">
        <section id="home">
            <h2>Home</h2>
            <p>Welcome to my web application.</p>
        </section>

        <section id="about">
            <h2>About</h2>
            <p>This section contains information about the application.</p>
        </section>

        <section id="projects" aria-labelledby="projects-title">
            <h2 id="projects-title">Projects</h2>

            <div id="projects-content">
                <p class="loading">Loading projects...</p>
            </div>
        </section>

        <section id="contact">
            <h2>Contact</h2>
            <p>This section contains contact information.</p>
        </section>
    </div>
</main>

    <footer>
        <p>&copy; 2026 My Web Application</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
